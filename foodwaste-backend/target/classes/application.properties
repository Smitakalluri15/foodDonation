# ===================================
# Server
# ===================================
server.port=8080

# ===================================
# MySQL Database
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/foodwaste_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Smita@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / Hibernate
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================
# JWT
# ===================================
app.jwt.secret=foodwaste_super_secret_key_change_in_production_min_256bits
app.jwt.expiration-ms=86400000

# ===================================
# CORS allowed origin
# ===================================
app.cors.allowed-origins=http://localhost:3000
spring.mvc.dispatch-options-request=true
server.error.whitelabel.enabled=false
spring.security.filter.dispatcher-types=request,async,error